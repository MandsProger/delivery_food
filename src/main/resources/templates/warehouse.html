<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <title>Управление поставками</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<header th:insert="~{blocks/header :: header}"></header>
<main>
    <div class="ms-5 me-5">
        <div class="mb-3 ms-5 me-5 mt-3">
            <label for="searchNumber" class="form-label h4">Поиск по номеру склада:</label>
            <input type="text" class="form-control" id="searchNumber" placeholder="Введите номер склада"/>
        </div>

        <table class="table table-striped table-bordered text-center px-2 px-md-4">
            <thead>
            <tr>
                <th scope="col">id поставки</th>
                <th scope="col">Дата</th>
                <th scope="col">Просмотр</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="warehouse, iterStat : ${warehouses}"
                th:if="${iterStat.index == 0 or warehouse.warehouseId != warehouses[iterStat.index - 1]?.warehouseId}">
                <td th:text="${warehouse.warehouseId}"></td>
                <td th:text="${warehouse.delivery_date != null ? #temporals.format(warehouse.delivery_date, 'dd MMMM yyyy HH:mm') : ''}"></td>
                <td>
                    <a th:href="'/admin/warehouse/' + ${warehouse.warehouseId}" class="btn btn-info">Подробнее</a>
                </td>
            </tr>
            </tbody>
        </table>

        <a href="warehouse/add" class="btn btn-success">Добавить поставку</a>
    </div>
</main>
<div th:insert="~{blocks/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const searchInput = document.getElementById("searchNumber");
        const tableRows = document.querySelectorAll("tbody tr");

        searchInput.addEventListener("keyup", function() {
            const filter = searchInput.value.toLowerCase();

            tableRows.forEach(row => {
                const warehouseCell = row.querySelector("td:first-child");
                if (warehouseCell) {
                    const warehouseText = warehouseCell.textContent.toLowerCase();
                    row.style.display = warehouseText.includes(filter) ? "" : "none";
                }
            });
        });
    });
</script>
</body>
</html>
