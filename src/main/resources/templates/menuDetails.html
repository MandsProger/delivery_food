<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <title>Меню ресторана</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<header th:insert="~{blocks/header :: header}"></header>
<main>
    <div class="container mt-5">
        <div class="row">
            <div th:each="el : ${menu}" class="col-md-4 mb-4">
                <div class="card">
                    <img th:src="@{/uploads/{imagePath}(imagePath=${el.imagePath})}"
                         th:alt="${'Изображение ' + el.name}" class="card-img-top"
                         style="height: 220px; object-fit: cover;"/>
                    <div class="card-body">
                        <h5 th:text="${el.name}" class="card-title"></h5>
                        <h6 th:text="'Цена: ' + ${el.price} + ' руб.'" class="card-subtitle mb-2 text-muted"></h6>
                        <h6 th:text="'Категория: ' + ${el.category}" class="card-subtitle mb-2 text-muted"></h6>
                        <h6 th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'')')}"
                            th:text="'Остаток на складе: ' + ${el.remainder}" class="card-subtitle mb-2 text-danger"></h6>
                        <p th:text="'Описание: ' + ${el.description}" class="card-text"></p>
                        <p th:text="'Объем: ' + ${el.volume}" class="card-text"></p>
                        <div th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'')')}" class="mt-3">
                            <a th:href="'/menu/' + ${el.foodId} + '/edit'" class="btn btn-warning">Редактировать</a>
                            <form th:action="'/menu/' + ${el.foodId} + '/remove'" method="post" class="d-inline-block">
                                <input type="hidden" name="_csrf" value="${_csrf.token}">
                                <button class="btn btn-danger" type="submit">Удалить</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:insert="~{blocks/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
