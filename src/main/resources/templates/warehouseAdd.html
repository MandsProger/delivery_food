<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <title>Добавление поставки</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
<header th:insert="~{blocks/header :: header}"></header>
<main>
    <div class="container mt-5 mb-5">
        <h2>Добавление поставки</h2>
        <form id="supplyForm" th:action="@{/admin/warehouse/add}" method="post">
            <div id="productFields">
                <div class="row mb-3 align-items-end product-row">
                    <div class="col">
                        <select class="form-select product-select" name="product[]" required>
                            <option value="">Выберите продукт</option>
                            <th:block th:each="item : ${menus}">
                                <option th:value="${item.name}" th:text="${item.name}"></option>
                            </th:block>
                        </select>
                    </div>
                    <div class="col">
                        <label class="form-label">Количество</label>
                        <input type="number" name="quantity[]" class="form-control" required min="1">
                    </div>
                    <div class="col-auto">
                        <button type="button" class="btn btn-danger removeProductButton">Удалить</button>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-secondary" id="addProductButton">Добавить продукт</button>
            <button type="submit" class="btn btn-primary">Сохранить поставку</button>
        </form>
    </div>
</main>
<div th:insert="~{blocks/footer :: footer}"></div>

<script>
// Скрипт для динамического добавления новых полей
document.addEventListener('DOMContentLoaded', function() {
    const originalOptions = document.querySelector('.product-select').innerHTML; // Сохраняем оригинальные варианты
    const selectedProducts = new Set(); // Уникальные выбранные значения

    function updateProductOptions() {
        document.querySelectorAll('.product-select').forEach(select => {
            const currentSelectValue = select.value;

            // Сбрасываем к оригинальным опциям
            select.innerHTML = originalOptions;
            selectedProducts.forEach(selected => {
                const option = select.querySelector(`option[value="${selected}"]`);
                if (option && option.value !== currentSelectValue) {
                    option.remove(); // Удаляем выбранные опции, кроме текущего значения
                }
            });

            // Если в данном select уже что-то выбрано, восстанавливаем его значение
            if (currentSelectValue) {
                select.value = currentSelectValue;
            }
        });
    }

    document.getElementById('addProductButton').addEventListener('click', function() {
        const newProductRow = document.createElement('div');
        newProductRow.classList.add('row', 'mb-3', 'align-items-end', 'product-row');
        newProductRow.innerHTML = `
            <div class="col">
                <select class="form-select product-select" name="product[]" required>
                    <option value="">Выберите продукт</option>
                    ${originalOptions}
                </select>
            </div>
            <div class="col">
                <label class="form-label">Количество</label>
                <input type="number" name="quantity[]" class="form-control" required min="1">
            </div>
            <div class="col-auto">
                <button type="button" class="btn btn-danger removeProductButton">Удалить</button>
            </div>
        `;
        document.getElementById('productFields').appendChild(newProductRow);
        updateProductOptions();
    });

    document.getElementById('productFields').addEventListener('click', function(event) {
        if (event.target.classList.contains('removeProductButton')) {
            const productRow = event.target.closest('.product-row');
            productRow.remove();
            updateProductOptions(); // Обновляем доступные опции после удаления
        }
    });

    document.getElementById('productFields').addEventListener('change', function(event) {
        if (event.target.classList.contains('product-select')) {
            const selectedValue = event.target.value;
            if (selectedValue) {
                selectedProducts.add(selectedValue); // Добавляем новое значение в набор выбранных
            } else {
                selectedProducts.delete(event.target.value); // Удаляем значение, если выбор отменён
            }
            updateProductOptions();
        }
    });

    // Начальная инициализация
    updateProductOptions();
});
</script>
<script>
// Включите отладку и покажите значение выбранного продукта перед отправкой формы
document.getElementById('supplyForm').addEventListener('submit', function() {
    const products = document.getElementsByName('product[]');
    const quantities = document.getElementsByName('quantity[]');
    for (let i = 0; i < products.length; i++) {
        console.log('Product: ' + products[i].value + '; Quantity: ' + quantities[i].value);
    }
});
</script>
</body>
</html>
