<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <title>Ваш заказ</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=b4892dee-bb9b-4b60-acbb-31b2f3f8dae6"></script>
    <style>
        #map {
            height: 400px; /* Высота карты */
            width: 100%;   /* Ширина карты */
            border-radius: 10px; /* Скругление углов */
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); /* Тень для карты */
        }
        .address {
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<header th:insert="~{blocks/header :: header}"></header>
<main>
    <div class="container mt-4 d-flex">
        <div class="address" style="width: 600px; margin-right: 20px; padding: 0">
            <h4 class="mb-4">Адрес доставки</h4>
            <div id="map"></div>
            <div class="form-row mb-2 d-flex">
                <input type="text" name="street" placeholder="Улица"
                       class="form-control mb-1" style="width: 280px;" required>
                <input type="text" name="house" placeholder="Дом" class="form-control"
                       style="width: 100px; height: 38px; margin-left: 10px;" required>
            </div>
            <div class="form-row mb-2 d-flex">
                <div class="form-floating form-row">
                    <input type="text" class="form-control" name="apartment" id="floatingInput" placeholder="кв./дом"
                           required>
                    <label for="floatingInput">кв./дом</label>
                </div>
                <div class="form-floating">
                    <input type="text" class="form-control" name="intercom" id="floatingInput1" placeholder="домофон"
                           required>
                    <label for="floatingInput1">домофон</label>
                </div>
                <div class="form-floating">
                    <input type="text" class="form-control" name="porch" id="floatingInput2" placeholder="подъезд"
                           required>
                    <label for="floatingInput2">подъезд</label>
                </div>
                <div class="form-floating">
                    <input type="text" class="form-control" name="floor" id="floatingInput3" placeholder="этаж"
                           required>
                    <label for="floatingInput3">этаж</label>
                </div>
            </div>
            <div class="form-row">
                <input type="text" name="comment" placeholder="Комментарий к заказу" class="form-control">
            </div>
        </div>

        <div class="timeOrder" style="margin-top: 50px; margin-left: 181px;">
            <h4>Время доставки</h4>
            <h5 th:text="'Будет примерно в ' + ${#temporals.format(currentTime, 'HH:mm')}"></h5>
        </div>

        <div class="contentOrder" style="width: 770px; margin-top: 640px; margin-left: -1027px;">
            <h4 class="mb-3">Ваш заказ</h4>
            <ul class="list-group">
                <li th:each="item : ${cartItems}" class="list-group-item d-flex align-items-center mb-3">
                    <div class="d-flex align-items-center flex-grow-1">
                        <div class="me-3" style="flex-shrink: 0;">
                            <div th:if="${menusMap[item.foodName] != null}">
                                <img th:src="@{/uploads/{imagePath}(imagePath=${menusMap[item.foodName].imagePath})}"
                                     th:alt="${'Изображение ' + menusMap[item.foodName].name}" class="img-fluid"
                                     style="width: 100px; height: 100px; object-fit: cover;"/>
                            </div>
                        </div>
                        <h4 th:text="${item.foodName}" style="margin: 0;" class="flex-grow-1"></h4>
                    </div>
                    <div class="d-flex align-items-center">
                        <div class="input-group me-2" style="width: 130px;">
                            <form th:action="'/order/' + ${item.id} + '/minus'" method="post" style="margin: 0;">
                                <button type="submit" class="btn btn-outline-secondary decrement-btn">-</button>
                            </form>
                            <input type="number" name="count" th:value="${item.count}" class="form-control text-center"
                                   style="appearance: none; -moz-appearance: textfield; margin: 0;" readonly
                                   onkeydown="return false;"/>
                            <form th:action="'/order/' + ${item.id} + '/plus'" method="post" style="margin: 0;">
                                <button type="submit" class="btn btn-outline-secondary increment-btn">+</button>
                            </form>
                        </div>
                        <h4 th:text="${item.price} + ' руб.'" style="margin: 0;" class="me-3"></h4>
                        <form th:action="'/order/' + ${item.id} + '/remove'" method="post">
                            <input type="hidden" name="_csrf" value="${_csrf.token}">
                            <button class="btn btn-outline-danger" type="submit">Удалить</button>
                        </form>
                    </div>
                </li>
            </ul>
        </div>

        <div class="payment" style="width: 400px; position: fixed; margin-top: 220px; margin-left: 800px;">
            <form id="paymentForm" method="post" action="/order/pay" style="flex-grow: 1;">
                <h4>Способ оплаты</h4>
                <select name="paymentMethod" class="mt-3 form-select">
                    <option value="CARD">Картой курьеру</option>
                    <option value="CASH">Наличные</option>
                </select><br>
                <h4>Цена:</h4>
                <h5 style="display: flex; justify-content: space-between;">
                    <span>Товары в заказе</span>
                    <span id="sumPrice" th:text="${sum} + ' руб.'"></span>
                </h5>
                <h5 style="display: flex; justify-content: space-between;">
                    <span>Доставка</span>
                    <span id="deliveryPrice" th:text="${sum > 1200 ? '0.0 руб.' : '149.0 руб.'}"></span>
                </h5>
                <h6 style="display: flex; justify-content: space-between; margin-top: 15px;">
                    <span>У вас <span th:text="${user.bonus}" id="userBonusMain"></span> бонусов</span>
                    <input type="hidden" id="userBonus" th:value="${user.bonus}">
                    <input type="hidden" id="discount" name="discount" th:value="0">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="flexSwitchCheckChecked">
                        <label class="form-check-label" for="flexSwitchCheckChecked">Списать</label>
                    </div>
                </h6>
                <h6 style="display: flex; justify-content: space-between;" class="discount">
                    <span>Сумма скидки</span>
                    <span id="discountAmount" style="color:green;">0 руб.</span>
                </h6>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <input type="hidden" name="_csrf" value="${_csrf.token}">
                    <button type="submit" class="btn btn-success mt-3" style="width: 60%;">Оплатить</button>
                    <input type="hidden" name="resultPrice" id="resultPrice"
                           value="${sum + (sum > 1200 ? 0.0 : 149.0)}">
                    <input type="hidden" name="userId" th:value="${user.getNumberPhone()}">
                    <input type="hidden" name="costDelivery" id="costDelivery" th:value="${sum > 1200 ? 0.0 : 149.0}">
                    <h3 id="totalPrice" style="margin-top: 20px;"></h3>
                </div>
            </form>
        </div>
    </div>
</main>
<script>

document.addEventListener("DOMContentLoaded", () => {
    const bonus = parseInt(document.getElementById('userBonus').value, 10) || 0; // Получаем количество бонусов из скрытого поля
    const sumElement = document.getElementById('sumPrice');
    const finalPriceElement = document.getElementById('resultPrice');
    const totalPriceElement = document.getElementById('totalPrice');
    const discountElement = document.getElementById('discount');
    const userBonusMainElement = document.getElementById('userBonusMain');
    const discountAmountElement = document.getElementById('discountAmount');

    const updatePrice = () => {
        const useBonus = document.getElementById('flexSwitchCheckChecked').checked;
        const sumText = sumElement.innerText.replace(/\s|руб\./g, '');
        const orderedSum = parseFloat(sumText) || 0; // Преобразуем в число

        // Определение стоимости доставки
        const deliveryPriceValue = orderedSum > 1200 ? 0 : 149;
        const maxBonusToUse = Math.floor(orderedSum * 0.3);

        // Сумма, которую можно использовать из бонусов
        const discountAmount = useBonus ? Math.min(bonus, maxBonusToUse) : 0;
        const reducedPrice = orderedSum + deliveryPriceValue - discountAmount; // Уменьшаем итоговую цену

        discountElement.value = discountAmount; // Отображаем скидку
        finalPriceElement.value = reducedPrice; // Обновляем значение в скрытом поле
        totalPriceElement.innerText = reducedPrice + ' руб.'; // Обновляем отображение итоговой цены
        discountAmountElement.innerText = discountAmount + ' руб.'; // Обновляем отображение суммы скидки

        // Обновляем количество доступных бонусов
        userBonusMainElement.textContent = bonus - discountAmount;
    };

    const checkbox = document.getElementById('flexSwitchCheckChecked');

    // Обработчик события изменения состояния чекбокса
    checkbox.addEventListener('change', updatePrice);

    // Инициализация отображения цен при загрузке страницы
    updatePrice();
});

    document.addEventListener("DOMContentLoaded", () => {
        let map;

        // Восстанавливаем значения форм из localStorage
        const addressFields = ["street", "house", "apartment", "intercom", "porch", "floor", "comment"];

        addressFields.forEach(field => {
            const fieldValue = localStorage.getItem(field);
            if (fieldValue) {
                document.querySelector(`input[name='${field}']`).value = fieldValue;
            }
        });

        // Сохраняем данные формы в localStorage при изменении
        addressFields.forEach(field => {
            document.querySelector(`input[name='${field}']`).addEventListener('input', (event) => {
                localStorage.setItem(field, event.target.value);
            });
        });

        // Инициализация карты
        ymaps.ready(() => {
            map = new ymaps.Map("map", {
                center: [54.1918, 45.1833], // Начальные координаты (Саранск)
                zoom: 12,
                controls: ['smallMapDefaultSet'],
                behaviors: ['default', 'scrollZoom']
            });

            // Обработка клика на карту
            map.events.add('click', e => {
                const coords = e.get('coords');
                if (!isInSaranck(coords)) {
                    alert("Выберите адрес внутри города Саранск и близлежащих районов.");
                    return;
                }

                // Удаление существующего маркера перед установкой нового
                if (map.geoObjects.getLength() > 0) {
                    map.geoObjects.remove(map.geoObjects.get(0));
                }

                // Создание и добавление нового маркера
                const marker = new ymaps.Placemark(coords, {
                    hintContent: 'Выберите адрес',
                    balloonContent: 'Вы здесь'
                }, {
                    preset: 'islands#icon',
                    iconColor: '#0095b6'
                });

                map.geoObjects.add(marker);
                getAddress(coords);
            });
        });

        function isInSaranck(coords) {
            const [latitude, longitude] = coords;
            return latitude >= 54.150 && latitude <= 54.230 && longitude >= 45.100 && longitude <= 45.300;
        }

        function getAddress(coords) {
            ymaps.geocode(coords).then(res => {
                const address = res.geoObjects.get(0).properties.get('name');
                fillAddressFields(address.split(', '));
            }).catch(err => alert("Не удалось получить адрес: " + err));
        }

        function fillAddressFields(components) {
            const [street, house] = components;
            const streetInput = document.querySelector("input[name='street']");
            const houseInput = document.querySelector("input[name='house']");

            streetInput.value = street || '';
            houseInput.value = house || '';

            // Сохраняем адрес в localStorage
            localStorage.setItem('street', streetInput.value);
            localStorage.setItem('house', houseInput.value);
        }

        // Обработка отправки формы
        document.querySelector("#paymentForm").addEventListener("submit", event => {
            const street = document.querySelector("input[name='street']").value;
            const house = document.querySelector("input[name='house']").value;
            const apartment = document.querySelector("input[name='apartment']").value;
            const floor = document.querySelector("input[name='floor']").value;

            // Проверка на заполненность обязательных полей
            if (!street || !house || !apartment || !floor) {
                event.preventDefault();
                alert("Пожалуйста, заполните обязательные поля адреса: Улица, Дом, Квартира и Этаж.");
                return;
            }

            const addressFields = ["street", "house", "apartment", "intercom", "porch", "floor", "comment"];
            addressFields.forEach(field => {
                localStorage.removeItem(field); // Удалить сохраненные значения при отправке формы
                let value = document.querySelector(`input[name='${field}']`).value;
                let hiddenField = document.createElement("input");
                hiddenField.type = "hidden";
                hiddenField.name = field;
                hiddenField.value = value;
                paymentForm.appendChild(hiddenField);
            });
        });
    });

    // Сохраняем позицию перед переходом
    window.onbeforeunload = function() {
        sessionStorage.setItem('scrollPos', window.scrollY);
    };

    // Восстанавливаем позицию после загрузки страницы
    window.onload = function() {
        const scrollPos = sessionStorage.getItem('scrollPos');
        if (scrollPos) {
            window.scrollTo(0, scrollPos);
            sessionStorage.removeItem('scrollPos'); // Удаляем позицию после использования
        }
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
